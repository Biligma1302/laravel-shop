services:
    web:
        image: dh-mirror.gitverse.ru/library/nginx:latest
        container_name: nginx-laravel
        ports:
            - "${WEB_PORT}:80"
        volumes:
            - ./Nginx/nginx.conf:/etc/nginx/conf.d/default.conf
            - ./:/var/www/html
        depends_on:
            - php-fpm

    php-fpm:
        container_name: php-fpm-laravel
        build:
            context: ./Php-fpm
            args:
                UID: ${UID}
                GID: ${GID}
        volumes:
            - ./:/var/www/html
        depends_on:
            postgres_db:
                condition: service_healthy

    postgres_db:
        image: dh-mirror.gitverse.ru/library/postgres:17
        container_name: postgres_db_laravel
        restart: always
        volumes:
            - ./docker/postgres/pgdata:/var/lib/postgresql/data
        environment:
            - POSTGRES_DB=${DB_DATABASE}
            - POSTGRES_USER=${DB_USERNAME}
            - POSTGRES_PASSWORD=${DB_PASSWORD}
        ports:
            - "${DB_PORT_HOST}:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 20s
            timeout: 15s
            retries: 5
            start_period: 10s

    rabbitmq:
        image: dh-mirror.gitverse.ru/library/rabbitmq:4-management
        container_name: rabbitmq
        restart: always
        environment:
            - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
            - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
            - RABBITMQ_DEFAULT_VHOST=${RABBITMQ_VHOST:-/}
        ports:
            - "${RABBITMQ_PORT:-5672}:5672"
            - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"

    redis:
        image: dh-mirror.gitverse.ru/library/redis:7-alpine
        container_name: redis_laravel
        restart: always
        ports:
            - "6379:6379"

    elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.1.0
        container_name: elasticsearch_laravel
        restart: unless-stopped
        environment:
            discovery.type: single-node
            xpack.security.enabled: "false"
            ES_JAVA_OPTS: "-Xms512m -Xmx512m"
        mem_limit: 1g
        volumes:
            - elasticsearch-data:/usr/share/elasticsearch/data
        ports:
            - "127.0.0.1:9200:9200"
        healthcheck:
            test: [ "CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null" ]
            interval: 10s
            timeout: 10s
            retries: 12
            start_period: 30s

    search-worker:
        image: ${COMPOSE_PROJECT_NAME:-laravel-shop}-php-fpm
        container_name: search-worker-laravel
        restart: unless-stopped
        volumes:
            - ./:/var/www/html
        command: php artisan queue:work rabbitmq --queue=products.search --sleep=1 --tries=5 --timeout=60
        depends_on:
            php-fpm:
                condition: service_started
            rabbitmq:
                condition: service_started
            elasticsearch:
                condition: service_healthy

volumes:
    elasticsearch-data:
